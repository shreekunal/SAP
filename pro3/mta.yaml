_schema-version: 3.3.0
ID: pro3
description: A simple CAP project.
version: 1.0.0
modules:
- name: pro3-db-deployer
  type: hdb
  path: gen/db
  properties:
    TARGET_CONTAINER: ~{pro3-db/service-name}
  requires:
  - name: pro3-db
  - name: global-grantor
    group: SERVICE_REPLACEMENTS
    properties:
      key: logical-global-grantor
      service: ~{global-grantor-service}
  parameters:
    buildpack: nodejs_buildpack
- name: pro3-srv
  type: nodejs
  path: gen/srv
  requires:
  - name: pro3-auth
  - name: pro3-db
  provides:
  - name: srv-api
    properties:
      srv-url: ${default-url}
  parameters:
    buildpack: nodejs_buildpack
    instances: 1
  build-parameters:
    builder: npm-ci
- name: pro3-app-content
  type: com.sap.application.content
  path: .
  requires:
  - name: pro3-repo-host
    parameters:
      content-target: true
  build-parameters:
    build-result: resources
    requires:
    - artifacts:
      - hybrid2usingpro3.zip
      name: hybrid2usingpro3
      target-path: resources/
- name: hybrid2usingpro3
  type: html5
  path: app/hybrid2_using_pro3
  build-parameters:
    build-result: dist
    builder: custom
    commands:
    - npm install
    - npm run build:cf
    supported-platforms: []
resources:
- name: pro3-auth
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      oauth2-configuration:
        credential-types:
        - binding-secret
        - x509
      tenant-mode: dedicated
      xsappname: pro3-${org}-${space}
    path: ./xs-security.json
    service: xsuaa
    service-plan: application
- name: pro3-db
  type: com.sap.xs.hdi-container
  parameters:
    service: hana
    service-plan: hdi-shared
  properties:
    service-name: ${service-name}
- name: global-grantor
  type: org.cloudfoundry.existing-service
  parameters:
    service-name: pro2-db
  properties:
    global-grantor-service: ${service-name}
- name: pro3-repo-host
  type: org.cloudfoundry.managed-service
  parameters:
    service: html5-apps-repo
    service-name: pro3-html5-service
    service-plan: app-host
- name: pro3-destination-service
  type: org.cloudfoundry.managed-service
  parameters:
    config:
      HTML5Runtime_enabled: false
      init_data:
        instance:
          destinations:
          - Authentication: NoAuthentication
            Name: ui5
            ProxyType: Internet
            Type: HTTP
            URL: https://ui5.sap.com
          existing_destinations_policy: update
      version: 1.0.0
    service: destination
    service-name: pro3-destination-service
    service-plan: lite
parameters:
  deploy_mode: html5-repo
  enable-parallel-deployments: true
build-parameters:
  before-all:
  - builder: custom
    commands:
    - npm ci
    - npx cds build --production
